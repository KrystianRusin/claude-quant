name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches the Raspberry Pi
          cache: pip
      - run: pip install -r requirements.txt
      - name: Shell syntax
        run: for f in scripts/*.sh review/*.sh; do bash -n "$f"; done
      - name: Tests
        run: python -m pytest -q
